name: CI - Test & Build

# 持续集成工作流：在 PR 和主分支推送时运行

on:
  push:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/**'

  pull_request:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch: # 允许手动触发

env:
  NODE_VERSION: '18'

jobs:
  # ==================== 代码质量检查 ====================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7.33.7
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: npm test

      - name: Check version consistency
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")

          if [ "$PACKAGE_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "⚠️  Version mismatch detected!"
            echo "   package.json:  $PACKAGE_VERSION"
            echo "   manifest.json: $MANIFEST_VERSION"
            echo ""
            echo "Please update both files to the same version."
            exit 1
          fi

          echo "✅ Versions are in sync: $PACKAGE_VERSION"

  # ==================== 构建测试 ====================
  build-test:
    name: Build Test - ${{ matrix.platform }}
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [chromium, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7.33.7
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .env file (for build)
        run: |
          # CI 构建使用随机占位符（不需要真实值）
          cat > .env << EOF
          MX_CHROMIUM_ID=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA$(openssl rand -base64 32 | tr -d '\n')
          MX_FIREFOX_ID={$(uuidgen | tr '[:upper:]' '[:lower:]')}
          MX_CHROMIUM_UPDATE_URL=https://example.com/updates.xml
          NODE_ENV=production
          EOF
          echo "✅ Generated random .env for CI build"

      - name: Build ${{ matrix.platform }}
        run: npm run build-${{ matrix.platform }}

      - name: Verify build output
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_FILE="dist/extension/maoxian-web-clipper-${{ matrix.platform }}-${VERSION}.zip"

          if [ -f "$ZIP_FILE" ]; then
            SIZE=$(ls -lh "$ZIP_FILE" | awk '{print $5}')
            echo "✅ Build successful!"
            echo "   File: $ZIP_FILE"
            echo "   Size: $SIZE"
          else
            echo "❌ Build failed! ZIP file not found: $ZIP_FILE"
            exit 1
          fi

      - name: Upload build artifact (for PR review)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.sha }}
          path: dist/extension/*.zip
          retention-days: 7

  # ==================== 汇总报告 ====================
  ci-summary:
    name: CI Summary
    needs: [lint-and-test, build-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ] || [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "❌ CI checks failed!"
            echo ""
            echo "Job Results:"
            echo "  - Lint & Test: ${{ needs.lint-and-test.result }}"
            echo "  - Build Test:  ${{ needs.build-test.result }}"
            exit 1
          fi

          echo "✅ All CI checks passed!"
          echo ""
          echo "Job Results:"
          echo "  - Lint & Test: ${{ needs.lint-and-test.result }}"
          echo "  - Build Test:  ${{ needs.build-test.result }}"

      - name: PR Comment Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## 🤖 CI Results

            ✅ All checks passed!

            - **Tests**: Passed
            - **Build (Chromium)**: Successful
            - **Build (Firefox)**: Successful
            - **Version Check**: Consistent

            Build artifacts are available in the workflow run.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
